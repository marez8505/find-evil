<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>FIND EVIL — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="login-body">

<div class="login-shell">
  <div class="login-card">

    <div class="login-logo">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none" aria-hidden="true">
        <circle cx="22" cy="22" r="21" stroke="#c0392b" stroke-width="1.5"/>
        <ellipse cx="22" cy="22" rx="12" ry="7" stroke="#c0392b" stroke-width="1.3"/>
        <circle cx="22" cy="22" r="3.5" fill="#c0392b"/>
        <line x1="5"  y1="22" x2="11" y2="22" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="33" y1="22" x2="39" y2="22" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <h1 class="login-title">FIND EVIL</h1>
    <p class="login-sub">Autonomous DFIR Agent — Local Access</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}" class="login-form" autocomplete="off">
      <label class="field-label" for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        class="field-input"
        placeholder="Enter access password"
        autofocus
        required
        autocomplete="current-password"
      >
      <button type="submit" class="btn-primary btn-full">Authenticate</button>
    </form>

    <p class="login-hint">Binding: 127.0.0.1 — Local access only</p>
  </div>
</div>

</body>
</html>
